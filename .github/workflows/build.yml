name: iOS Unsigned Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build without Code Signing
      run: |
        xcodebuild clean build \
          -project iOS16-Live-Activities.xcodeproj \
          -alltargets \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CONFIGURATION_BUILD_DIR="$(pwd)/build"

    - name: Package into IPA
      run: |
        mkdir -p Payload
        mv build/*.app Payload/
        
        # 위젯 확장 파일(.appex)이 빌드된 경우 메인 앱의 PlugIns 폴더로 자동 병합
        if ls build/*.appex 1> /dev/null 2>&1; then
          mkdir -p Payload/*.app/PlugIns
          mv build/*.appex Payload/*.app/PlugIns/
        fi
        
        zip -r app.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-ipa
        path: app.ipa
